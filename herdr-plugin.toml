id = "annotate"
name = "Annotate"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Comment on terminal selections and copy annotations as agent context."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "capture"
title = "Annotate selection"
description = "Open a comment dialog for the current terminal selection."
contexts = ["pane"]
command = ["bun", "run", "src/capture.ts"]

[[actions]]
id = "copy-context"
title = "Copy annotations as context"
description = "Copy all saved annotations to the clipboard as Markdown."
contexts = ["global"]
command = ["bun", "run", "src/export.ts"]

[[actions]]
id = "manage"
title = "Manage annotations"
description = "Browse, copy, archive, restore, and delete annotations."
contexts = ["global"]
command = ["bun", "run", "src/open-manager.ts"]

[[panes]]
id = "editor"
title = "Annotate"
placement = "popup"
width = 88
height = 24
command = ["bun", "run", "src/editor.ts"]

[[panes]]
id = "manager"
title = "Annotations"
placement = "popup"
width = 100
height = 30
command = ["bun", "run", "src/manager.ts"]
