# Herdr Annotate, lite: the terminal annotation tools only, no plannotator-tui binary download.
# Install with: herdr plugin install plannotator/herdr-annotate/lite
# The full plugin at the repository root adds document review with plannotator-tui.
#
# The build hook and every command reach one directory up, so the Lite variant shares the
# repository's single staged binary the way it used to share its TypeScript sources. Link a local
# build with scripts/stage-local.sh, which `herdr plugin link` cannot run for you.

id = "annotate"
name = "Annotate"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Comment on terminal selections and copy annotations as agent context."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["macos", "linux"]
command = ["bash", "../scripts/fetch-herdr-annotate.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "../scripts/fetch-herdr-annotate.ps1"]

# Herdr resolves explicit relative programs against $HERDR_PLUGIN_ROOT, and the two panes below
# are opened by the plugin itself with --cwd set to that root. The common `.exe` suffix lets one
# argv-only manifest work on all three platforms; it is an ordinary executable filename on
# macOS/Linux and the required executable suffix on Windows.
[[actions]]
id = "capture"
title = "Annotate selection"
description = "Open a comment dialog for the current terminal selection."
contexts = ["pane"]
command = ["../bin/herdr-annotate.exe", "capture"]

[[actions]]
id = "copy-context"
title = "Copy annotations as context"
description = "Copy all saved annotations to the clipboard as Markdown."
contexts = ["global"]
command = ["../bin/herdr-annotate.exe", "copy-context"]

[[actions]]
id = "copy-archive"
title = "Copy annotations as context and archive them"
description = "Copy all saved annotations to the clipboard as Markdown, then archive them."
contexts = ["global"]
command = ["../bin/herdr-annotate.exe", "copy-archive"]

[[actions]]
id = "manage"
title = "Manage annotations"
description = "Browse, copy, archive, restore, and delete annotations."
contexts = ["global"]
command = ["../bin/herdr-annotate.exe", "manage"]

[[panes]]
id = "editor"
title = "Annotate"
placement = "popup"
width = 88
height = 24
command = ["../bin/herdr-annotate.exe", "editor"]

[[panes]]
id = "manager"
title = "Annotations"
placement = "popup"
width = 100
height = 30
command = ["../bin/herdr-annotate.exe", "manager"]
