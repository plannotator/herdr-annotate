id = "annotate"
name = "Annotate"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Comment on terminal selections and copy annotations as agent context."
platforms = ["linux", "macos", "windows"]

# ---------------------------------------------------------------------------------------
# Terminal annotations, served by the native herdr-annotate runtime. A prebuilt binary is
# fetched into bin/ at build time on all three platforms. Herdr resolves explicit relative
# programs against $HERDR_PLUGIN_ROOT, and the two panes below are opened by the plugin itself
# with --cwd set to that root, so one argv-only command works everywhere. The `.exe` suffix is
# an ordinary executable filename on macOS and Linux and the required suffix on Windows.

[[build]]
platforms = ["macos", "linux"]
command = ["bash", "scripts/fetch-herdr-annotate.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-herdr-annotate.ps1"]

[[actions]]
id = "capture"
title = "Annotate selection"
description = "Open a comment dialog for the current terminal selection."
contexts = ["pane"]
command = ["./bin/herdr-annotate.exe", "capture"]

[[actions]]
id = "copy-context"
title = "Copy annotations as context"
description = "Copy all saved annotations to the clipboard as Markdown."
contexts = ["global"]
command = ["./bin/herdr-annotate.exe", "copy-context"]

[[actions]]
id = "copy-archive"
title = "Copy annotations as context and archive them"
description = "Copy all saved annotations to the clipboard as Markdown, then archive them."
contexts = ["global"]
command = ["./bin/herdr-annotate.exe", "copy-archive"]

[[actions]]
id = "manage"
title = "Manage annotations"
description = "Browse, copy, archive, restore, and delete annotations."
contexts = ["global"]
command = ["./bin/herdr-annotate.exe", "manage"]

[[panes]]
id = "editor"
title = "Annotate"
placement = "popup"
width = 88
height = 24
command = ["./bin/herdr-annotate.exe", "editor"]

[[panes]]
id = "manager"
title = "Annotations"
placement = "popup"
width = 100
height = 30
command = ["./bin/herdr-annotate.exe", "manager"]

# ---------------------------------------------------------------------------------------
# Document review with plannotator-tui (https://github.com/plannotator/plannotator-tui).
# Actions resolve explicit relative programs against $HERDR_PLUGIN_ROOT. The review pane is
# opened with --cwd set to the folder under review, so it retains the plugin-root wrapper.
# A prebuilt binary is fetched into bin/ at build time on macOS and Linux. Where it opens
# (overlay | split | popup) remains the user's choice in plannotator-tui's config file.

[[build]]
platforms = ["macos", "linux"]
command = ["bash", "scripts/fetch-plannotator-tui.sh"]

[[panes]]
id = "doc"
title = "Annotate"
placement = "overlay"
platforms = ["macos", "linux"]
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/plannotator-tui.sh\" herdr pane"]

# Both actions run the launcher, which reads Herdr's invocation context: the focused pane's
# folder (open) or the clicked file:// link (open-link), and the focused pane's agent as
# the target the review is sent back to.
[[actions]]
id = "open"
title = "Annotate: open here"
description = "Review the focused pane's folder in plannotator-tui and send feedback to its agent."
contexts = ["workspace", "pane"]
platforms = ["macos", "linux"]
command = ["./bin/plannotator-tui.exe", "herdr", "open"]

[[actions]]
id = "open-link"
title = "Annotate this file"
description = "Open a Ctrl-clicked Markdown file in plannotator-tui."
contexts = ["pane"]
platforms = ["macos", "linux"]
command = ["./bin/plannotator-tui.exe", "herdr", "open"]

[[actions]]
id = "last"
title = "Annotate: agent's last message"
description = "Review the focused agent's most recent message in plannotator-tui and send feedback back."
contexts = ["pane"]
platforms = ["macos", "linux"]
command = ["./bin/plannotator-tui.exe", "herdr", "last"]

# Ctrl-click on a file:// Markdown link. Anchored on the scheme so web links never match.
[[link_handlers]]
id = "markdown-file"
title = "Annotate this file"
pattern = "^file://.*\\.(md|markdown|mdx)$"
action = "open-link"
platforms = ["macos", "linux"]
