name: rust-lite-ci

on:
  pull_request:
    paths:
      - "rust/**"
      - "lite/**"
      - "herdr-plugin.toml"
      - "herdr-annotate.version"
      - "scripts/fetch-herdr-annotate.*"
      - "scripts/lite-goldens/**"
      - "scripts/lite-regression.py"
      - "scripts/lite-regression.sh"
      - "scripts/smoke.sh"
      - "scripts/stage-local.sh"
      - ".github/workflows/rust-lite-*.yml"
  merge_group:

concurrency:
  group: rust-lite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helper-version:
    # Installs download the released helper pinned by herdr-annotate.version,
    # so a rust/ change only reaches users after a version bump and release.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rust/ changes come with a helper version bump
        run: |
          version=$(tr -d '[:space:]' < herdr-annotate.version)
          tag="rust-lite-v$version"
          if [ -z "$(git tag -l 'rust-lite-v*')" ]; then
            echo "::error::no rust-lite-v* tags fetched; cannot compare rust/ with the released helper"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is not released yet; treating herdr-annotate.version as bumped"
            exit 0
          fi
          if ! git diff --quiet "$tag" HEAD -- rust/; then
            git diff --stat "$tag" HEAD -- rust/
            echo "::error::rust/ differs from $tag but herdr-annotate.version is still $version. Bump the helper version (herdr-annotate.version, rust/Cargo.toml, rust/Cargo.lock) so the change ships in a release."
            exit 1
          fi
          echo "rust/ matches $tag"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --all-targets

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/lite-regression.sh
