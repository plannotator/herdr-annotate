name: rust-lite-ci

on:
  pull_request:
    paths:
      - "rust/**"
      - "lite/**"
      - "herdr-plugin.toml"
      - "herdr-annotate.version"
      - "scripts/fetch-herdr-annotate.*"
      - "scripts/lite-goldens/**"
      - "scripts/lite-regression.py"
      - "scripts/lite-regression.sh"
      - "scripts/smoke.sh"
      - "scripts/stage-local.sh"
      - ".github/workflows/rust-lite-*.yml"
  merge_group:

concurrency:
  group: rust-lite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --all-targets

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/lite-regression.sh
